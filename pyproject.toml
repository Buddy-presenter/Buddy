[tool.ruff]
target-version = "py312"
line-length = 100
src = ["frontend/src", "backend/src", "shared/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["buddy_api", "buddy_desktop", "buddy_identity"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["frontend/src/buddy_desktop", "backend/src/buddy_api", "shared/src/buddy_identity"]

[tool.pytest.ini_options]
testpaths = ["frontend/tests", "backend/tests", "tests/integration", "tests/repository"]
qt_api = "pyside6"
addopts = "-ra"
markers = ["postgres: real PostgreSQL integration using isolated disposable test schemas"]
