name: Backend promotion and rollback
on:
  workflow_run:
    workflows: [Continuous integration]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        required: true
      rollout_phase:
        description: 'Staging: compatibility bridge, paused-worker reader preparation if needed, then feature'
        type: choice
        options: [feature, compatibility, reader]
        default: feature
      worker_image:
        description: 'Optional immutable worker digest for production-only promotion'
        type: string
      bootstrap_worker_image:
        description: 'Publish and test a staging worker image for the one-time paused Terraform service bootstrap'
        type: boolean
        default: false
      rollback_revision:
        description: 'Healthy deployment SHA whose previous task definitions should be restored'
        type: string
permissions:
  contents: read
  checks: read
  id-token: write
concurrency:
  group: backend-release-${{ inputs.target || 'staging' }}
  cancel-in-progress: false
  queue: max
jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      checks: read
    outputs:
      revision: ${{ steps.manual.outputs.revision || steps.automatic.outputs.revision }}
      deploy: ${{ steps.manual.outputs.deploy || steps.automatic.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select manual main revision
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: manual
        env:
          REVISION: ${{ github.sha }}
        run: |
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Wait for successful exact-main checks
        if: github.event_name == 'workflow_run'
        id: automatic
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/automatic_staging.py
  deploy:
    needs: revision
    if: needs.revision.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target || 'staging' }}
    env:
      RELEASE_REVISION: ${{ needs.revision.outputs.revision }}
      AUTOMATIC_STAGING: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.revision.outputs.revision }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify revision and promotion evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target || 'staging' }}
          STAGING_ACCEPTED_REVISION: ${{ vars.BUDDY_STAGING_ACCEPTED_REVISION }}
          CALLBACK_RELEASE_APPROVED: ${{ vars.BUDDY_CALLBACK_RELEASE_APPROVED }}
          RELEASE_OPERATION: ${{ inputs.rollback_revision != '' && 'rollback' || 'deploy' }}
          ROLLOUT_PHASE: ${{ inputs.rollout_phase || 'feature' }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
        run: python scripts/release/gate.py
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.BUDDY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.BUDDY_AWS_REGION }}
      - name: Verify AWS account before publishing or deploying
        shell: bash
        env:
          EXPECTED_AWS_ACCOUNT: ${{ vars.BUDDY_AWS_ACCOUNT_ID }}
        run: |
          actual_account=$(aws sts get-caller-identity --query Account --output text)
          test "$actual_account" = "$EXPECTED_AWS_ACCOUNT"
      - name: Detect the Terraform-managed staging worker service
        if: (inputs.target || 'staging') == 'staging'
        id: worker_service
        shell: bash
        env:
          BUDDY_DEPLOYMENT_CONFIG: ${{ vars.BUDDY_DEPLOYMENT_CONFIG }}
        run: |
          cluster=$(python -c 'import json,os; print(json.loads(os.environ["BUDDY_DEPLOYMENT_CONFIG"])["cluster"])')
          response=$(aws ecs describe-services --cluster "$cluster" --services worker --output json)
          exists=$(python -c 'import json,sys; data=json.load(sys.stdin); print("true" if len(data.get("services", [])) == 1 and not data.get("failures") else "false")' <<< "$response")
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - run: python -m pip install boto3==1.40.50
      - name: Build and push this exact reviewed revision
        if: ${{ !inputs.rollback_revision }}
        id: image
        shell: bash
        env:
          AWS_ACCOUNT: ${{ vars.BUDDY_AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.BUDDY_AWS_REGION }}
          BUDDY_DEPLOYMENT_CONFIG: ${{ vars.BUDDY_DEPLOYMENT_CONFIG }}
          RELEASE_TARGET: ${{ inputs.target || 'staging' }}
          ROLLOUT_PHASE: ${{ inputs.rollout_phase || 'feature' }}
          WORKER_SERVICE_EXISTS: ${{ steps.worker_service.outputs.exists || 'false' }}
          BOOTSTRAP_WORKER_IMAGE: ${{ inputs.bootstrap_worker_image || 'false' }}
        run: |
          registry="$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          repository="buddy-$RELEASE_TARGET/api"
          tag="$RELEASE_REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker build -f infra/container/Dockerfile --label "org.opencontainers.image.revision=$RELEASE_REVISION" -t "$registry/$repository:$tag" .
          docker push "$registry/$repository:$tag"
          digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          feature_image="$registry/$repository@$digest"
          api_image="$feature_image"
          if [ "$ROLLOUT_PHASE" = compatibility ]; then
            cluster=$(python -c 'import json,os; print(json.loads(os.environ["BUDDY_DEPLOYMENT_CONFIG"])["cluster"])')
            task_definition=$(aws ecs describe-services --cluster "$cluster" --services api --query 'services[0].taskDefinition' --output text)
            previous_image=$(aws ecs describe-task-definition --task-definition "$task_definition" --query 'taskDefinition.containerDefinitions[?name==`api`].image | [0]' --output text)
            case "$previous_image" in "$registry/$repository@sha256:"*) ;; *) echo "Live staging API is not a pinned image in the expected ECR repository" >&2; exit 1 ;; esac
            echo "previous_image=$previous_image" >> "$GITHUB_OUTPUT"
            docker build -f infra/container/Dockerfile.compatibility --build-arg "PREVIOUS_IMAGE=$previous_image" --label "org.opencontainers.image.revision=$RELEASE_REVISION" -t "$registry/$repository:$tag-compatibility" .
            docker push "$registry/$repository:$tag-compatibility"
            bridge_digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag-compatibility" --query 'imageDetails[0].imageDigest' --output text)
            api_image="$registry/$repository@$bridge_digest"
            echo "future_image=$feature_image" >> "$GITHUB_OUTPUT"
          fi
          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_TARGET" = staging ] && [ "$ROLLOUT_PHASE" = feature ] && { [ "$WORKER_SERVICE_EXISTS" = true ] || [ "$BOOTSTRAP_WORKER_IMAGE" = true ]; }; then
            worker_repository="buddy-$RELEASE_TARGET/worker"
            worker_tag="$RELEASE_REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker build -f infra/container/Dockerfile.worker --label "org.opencontainers.image.revision=$RELEASE_REVISION" -t "$registry/$worker_repository:$worker_tag" .
            docker push "$registry/$worker_repository:$worker_tag"
            worker_digest=$(aws ecr describe-images --repository-name "$worker_repository" --image-ids "imageTag=$worker_tag" --query 'imageDetails[0].imageDigest' --output text)
            worker_image="$registry/$worker_repository@$worker_digest"
            echo "worker_image=$worker_image" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_TARGET" = staging ] && [ "$BOOTSTRAP_WORKER_IMAGE" = true ]; then
            echo "A bootstrap image can only be published during the staging feature phase." >&2
            exit 1
          fi
          docker logout "$registry"
      - name: Prove exact rollback-image compatibility before staging DDL
        if: (inputs.target || 'staging') == 'staging'
        env:
          BUDDY_DEPLOYMENT_CONFIG: ${{ vars.BUDDY_DEPLOYMENT_CONFIG }}
          API_IMAGE: ${{ steps.image.outputs.api_image }}
          FUTURE_IMAGE: ${{ steps.image.outputs.future_image }}
          BASE_IMAGE: ${{ steps.image.outputs.previous_image }}
          ROLLOUT_PHASE: ${{ inputs.rollout_phase || 'feature' }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
          AWS_ACCOUNT: ${{ vars.BUDDY_AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.BUDDY_AWS_REGION }}
          STAGING_WORKER_IMAGE: ${{ steps.image.outputs.worker_image }}
        shell: bash
        run: |
          registry="$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry"' EXIT
          args=(--revision "$RELEASE_REVISION" --output compatibility-report.json)
          if [ -n "$ROLLBACK_REVISION" ]; then args+=(--rollback-revision "$ROLLBACK_REVISION"); else args+=(--candidate-image "$API_IMAGE"); fi
          if [ -n "$FUTURE_IMAGE" ]; then args+=(--future-image "$FUTURE_IMAGE" --base-image "$BASE_IMAGE"); fi
          if [ "$ROLLOUT_PHASE" = reader ]; then args+=(--reader-only); fi
          if [ -n "$STAGING_WORKER_IMAGE" ]; then args+=(--worker-image "$STAGING_WORKER_IMAGE"); fi
          python -m backend.scripts.release.prepare_compatibility "${args[@]}"
      - name: Retain credential-free compatibility evidence
        if: (inputs.target || 'staging') == 'staging' && hashFiles('compatibility-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-rollback-compatibility
          path: compatibility-report.json
      - name: Prepare exact image references for paused worker provisioning
        if: (inputs.target || 'staging') == 'staging' && steps.image.outputs.worker_image != ''
        shell: bash
        env:
          API_IMAGE: ${{ steps.image.outputs.api_image }}
          WORKER_IMAGE: ${{ steps.image.outputs.worker_image }}
          WORKER_SERVICE_EXISTS: ${{ steps.worker_service.outputs.exists || 'false' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("staging-images.json").write_text(json.dumps({
              "api_image": os.environ["API_IMAGE"],
              "worker_image": os.environ["WORKER_IMAGE"],
              "worker_service_exists": os.environ["WORKER_SERVICE_EXISTS"] == "true",
          }, indent=2) + "\n")
          PY
          if [ "$WORKER_SERVICE_EXISTS" = false ]; then
            echo "Worker image: `$WORKER_IMAGE` (tested; service not yet provisioned)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (inputs.target || 'staging') == 'staging' && steps.image.outputs.worker_image != ''
        with:
          name: staging-release-images
          path: staging-images.json
          if-no-files-found: error
      - name: Migrate then promote, or restore an audited deployment
        env:
          GH_TOKEN: ${{ github.token }}
          BUDDY_DEPLOYMENT_CONFIG: ${{ vars.BUDDY_DEPLOYMENT_CONFIG }}
          API_IMAGE: ${{ steps.image.outputs.api_image }}
          WORKER_IMAGE: ${{ steps.image.outputs.worker_image || inputs.worker_image }}
          WORKER_SERVICE_EXISTS: ${{ steps.worker_service.outputs.exists || 'false' }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
          RELEASE_TARGET: ${{ inputs.target || 'staging' }}
          ROLLOUT_PHASE: ${{ inputs.rollout_phase || 'feature' }}
        shell: bash
        run: |
          args=(--revision "$RELEASE_REVISION")
          if [ "$ROLLOUT_PHASE" = reader ]; then args+=(--reader-only); fi
          if [ "$RELEASE_TARGET" = staging ]; then args+=(--compatibility-report compatibility-report.json); fi
          if [ -n "$ROLLBACK_REVISION" ]; then
            args+=(--rollback-revision "$ROLLBACK_REVISION")
          else
            args+=(--api-image "$API_IMAGE")
            if [ -n "$WORKER_IMAGE" ] && { [ "$RELEASE_TARGET" != staging ] || [ "$WORKER_SERVICE_EXISTS" = true ]; }; then args+=(--worker-image "$WORKER_IMAGE"); fi
          fi
          python backend/scripts/release/deploy.py "${args[@]}"
