name: Backend promotion and rollback
on:
  workflow_run:
    workflows: [Continuous integration]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        required: true
      rollout_phase:
        description: 'Staging transition: compatibility first, then feature after a separate approval'
        type: choice
        options: [feature, compatibility]
        default: feature
      worker_image:
        description: 'Optional reviewed worker digest with a real container health check'
        type: string
      rollback_revision:
        description: 'Healthy deployment SHA whose previous task definitions should be restored'
        type: string
permissions:
  contents: read
  checks: read
  id-token: write
concurrency:
  group: backend-release-${{ inputs.target || 'staging' }}
  cancel-in-progress: false
  queue: max
jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      checks: read
    outputs:
      revision: ${{ steps.manual.outputs.revision || steps.automatic.outputs.revision }}
      deploy: ${{ steps.manual.outputs.deploy || steps.automatic.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select manual main revision
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: manual
        env:
          REVISION: ${{ github.sha }}
        run: |
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Wait for successful exact-main checks
        if: github.event_name == 'workflow_run'
        id: automatic
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/automatic_staging.py
  deploy:
    needs: revision
    if: needs.revision.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target || 'staging' }}
    env:
      RELEASE_REVISION: ${{ needs.revision.outputs.revision }}
      AUTOMATIC_STAGING: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.revision.outputs.revision }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify revision and promotion evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target || 'staging' }}
          STAGING_ACCEPTED_REVISION: ${{ vars.BUDDY_STAGING_ACCEPTED_REVISION }}
          CALLBACK_RELEASE_APPROVED: ${{ vars.BUDDY_CALLBACK_RELEASE_APPROVED }}
          RELEASE_OPERATION: ${{ inputs.rollback_revision != '' && 'rollback' || 'deploy' }}
          ROLLOUT_PHASE: ${{ inputs.rollout_phase || 'feature' }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
        run: python scripts/release/gate.py
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.BUDDY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.BUDDY_AWS_REGION }}
      - name: Verify AWS account before publishing or deploying
        shell: bash
        env:
          EXPECTED_AWS_ACCOUNT: ${{ vars.BUDDY_AWS_ACCOUNT_ID }}
        run: |
          actual_account=$(aws sts get-caller-identity --query Account --output text)
          test "$actual_account" = "$EXPECTED_AWS_ACCOUNT"
      - run: python -m pip install boto3==1.40.50
      - name: Build and push this exact reviewed revision
        if: ${{ !inputs.rollback_revision }}
        id: image
        shell: bash
        env:
          AWS_ACCOUNT: ${{ vars.BUDDY_AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.BUDDY_AWS_REGION }}
          RELEASE_TARGET: ${{ inputs.target || 'staging' }}
          ROLLOUT_PHASE: ${{ inputs.rollout_phase || 'feature' }}
        run: |
          registry="$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          repository="buddy-$RELEASE_TARGET/api"
          tag="$RELEASE_REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker build -f infra/container/Dockerfile --label "org.opencontainers.image.revision=$RELEASE_REVISION" -t "$registry/$repository:$tag" .
          docker push "$registry/$repository:$tag"
          digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          feature_image="$registry/$repository@$digest"
          api_image="$feature_image"
          if [ "$ROLLOUT_PHASE" = compatibility ]; then
            docker build -f infra/container/Dockerfile.compatibility --label "org.opencontainers.image.revision=$RELEASE_REVISION" -t "$registry/$repository:$tag-compatibility" .
            docker push "$registry/$repository:$tag-compatibility"
            bridge_digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag-compatibility" --query 'imageDetails[0].imageDigest' --output text)
            api_image="$registry/$repository@$bridge_digest"
            echo "future_image=$feature_image" >> "$GITHUB_OUTPUT"
          fi
          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          docker logout "$registry"
      - name: Prove exact rollback-image compatibility before staging DDL
        if: (inputs.target || 'staging') == 'staging'
        env:
          BUDDY_DEPLOYMENT_CONFIG: ${{ vars.BUDDY_DEPLOYMENT_CONFIG }}
          API_IMAGE: ${{ steps.image.outputs.api_image }}
          FUTURE_IMAGE: ${{ steps.image.outputs.future_image }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
          AWS_ACCOUNT: ${{ vars.BUDDY_AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.BUDDY_AWS_REGION }}
        shell: bash
        run: |
          registry="$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry"' EXIT
          args=(--revision "$RELEASE_REVISION" --output compatibility-report.json)
          if [ -n "$ROLLBACK_REVISION" ]; then args+=(--rollback-revision "$ROLLBACK_REVISION"); else args+=(--candidate-image "$API_IMAGE"); fi
          if [ -n "$FUTURE_IMAGE" ]; then args+=(--future-image "$FUTURE_IMAGE"); fi
          python -m backend.scripts.release.prepare_compatibility "${args[@]}"
      - name: Retain credential-free compatibility evidence
        if: (inputs.target || 'staging') == 'staging' && hashFiles('compatibility-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-rollback-compatibility
          path: compatibility-report.json
      - name: Migrate then promote, or restore an audited deployment
        env:
          BUDDY_DEPLOYMENT_CONFIG: ${{ vars.BUDDY_DEPLOYMENT_CONFIG }}
          API_IMAGE: ${{ steps.image.outputs.api_image }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
          RELEASE_TARGET: ${{ inputs.target || 'staging' }}
        shell: bash
        run: |
          args=(--revision "$RELEASE_REVISION")
          if [ "$RELEASE_TARGET" = staging ]; then args+=(--compatibility-report compatibility-report.json); fi
          if [ -n "$ROLLBACK_REVISION" ]; then
            args+=(--rollback-revision "$ROLLBACK_REVISION")
          else
            args+=(--api-image "$API_IMAGE")
            if [ -n "$WORKER_IMAGE" ]; then args+=(--worker-image "$WORKER_IMAGE"); fi
          fi
          python backend/scripts/release/deploy.py "${args[@]}"
