name: Security scans

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e ./shared
          python -m pip install -e "./frontend[dev]" -e "./backend[api,dev]" -r .github/security-requirements.txt
      - name: Export resolved third-party dependencies
        run: python -m pip freeze --exclude buddy-desktop --exclude buddy-backend --exclude buddy-identity > "$RUNNER_TEMP/audit-requirements.txt"
      - name: Audit installed dependencies; any known vulnerability blocks CI
        run: python -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt" --progress-spinner off

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/security-requirements.txt
      - name: Block high-severity findings at any confidence
        run: python scripts/security_scan.py

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan full Git history with the pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/buddy-gitleaks"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --proto '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            -o "$tools/gitleaks.tar.gz"
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  $tools/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          "$tools/gitleaks" git --redact --log-opts='--all'
