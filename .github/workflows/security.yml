name: Security scans

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e ./shared
          python -m pip install -e "./frontend[dev]" -e "./backend[api,dev]" -r .github/security-requirements.txt
      - name: Export resolved third-party dependencies
        run: python -m pip freeze --exclude buddy-desktop --exclude buddy-backend --exclude buddy-identity > "$RUNNER_TEMP/audit-requirements.txt"
      - name: Audit installed dependencies; any known vulnerability blocks CI
        run: python -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt" --progress-spinner off

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/security-requirements.txt
      - name: Block high-severity findings at any confidence
        run: python scripts/security_scan.py

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.24.2'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
