name: Publish desktop channel
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
  checks: read
  id-token: write
  attestations: write
concurrency:
  group: desktop-release-${{ inputs.target }}
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    environment: release-${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact revision and production acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target }}
          STAGING_ACCEPTED_REVISION: ${{ vars.BUDDY_STAGING_ACCEPTED_REVISION }}
          CALLBACK_RELEASE_APPROVED: ${{ vars.BUDDY_CALLBACK_RELEASE_APPROVED }}
        run: python scripts/release/gate.py
      - run: python -m pip install -e ./shared
      - run: python -m pip install -e "./frontend[dev]" PyInstaller==6.22.3
      - name: Install checksum-pinned Windows compiler
        if: runner.os == 'Windows'
        run: ./frontend/scripts/release/install_inno.ps1
      - name: Import production macOS signing identity
        if: runner.os == 'macOS' && inputs.target == 'production'
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: bash frontend/scripts/release/macos_keychain.sh
      - name: Build native package
        shell: bash
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          RELEASE_TARGET: ${{ inputs.target }}
          DESKTOP_PUBLIC_CONFIG: ${{ vars.BUDDY_DESKTOP_PUBLIC_CONFIG }}
        run: |
          args=(--output packaged --revision "$GITHUB_SHA")
          if [ "$RELEASE_TARGET" = production ]; then
            python -c 'import os,pathlib; pathlib.Path("desktop-public.json").write_text(os.environ["DESKTOP_PUBLIC_CONFIG"])'
            args+=(--channel stable --deployment-config desktop-public.json)
            if [ "$RUNNER_OS" = macOS ]; then args+=(--signing-identity "$MAC_SIGNING_IDENTITY"); fi
          fi
          python frontend/scripts/release/build_desktop.py "${args[@]}"
      - name: Sign and verify production Windows installer
        if: runner.os == 'Windows' && inputs.target == 'production'
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: ./frontend/scripts/release/sign_windows.ps1 -OutputDirectory packaged
      - name: Notarize and staple production macOS application
        if: runner.os == 'macOS' && inputs.target == 'production'
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: bash frontend/scripts/release/notarize_macos.sh packaged
      - name: Hash final signed artifacts
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          channel=preview
          if [ "$RELEASE_TARGET" = production ]; then channel=stable; fi
          python frontend/scripts/release/build_desktop.py --manifest-only --output packaged --revision "$GITHUB_SHA" --channel "$channel"
      - run: python frontend/scripts/release/smoke_package.py packaged
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4
        with:
          subject-path: |
            packaged/*.exe
            packaged/*.zip
            packaged/manifest.json
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.BUDDY_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.BUDDY_AWS_REGION }}
          allowed-account-ids: ${{ vars.BUDDY_AWS_ACCOUNT_ID }}
      - name: Publish only verified immutable channel artifacts
        shell: bash
        env:
          RELEASE_BUCKET: ${{ vars.BUDDY_RELEASE_BUCKET }}
          RELEASE_TARGET: ${{ inputs.target }}
          AWS_ACCOUNT: ${{ vars.BUDDY_AWS_ACCOUNT_ID }}
        run: |
          python -m pip install boto3==1.40.50
          python -m frontend.scripts.release.publish packaged
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS' && inputs.target == 'production'
        run: security delete-keychain "$RUNNER_TEMP/buddy-signing.keychain-db"
