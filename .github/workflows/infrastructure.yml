name: Infrastructure validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    name: Terraform boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform fmt -check -diff -recursive
      - name: Validate all roots without AWS credentials or state access
        shell: bash
        run: |
          # Validate reusable-module aliases through their real consuming roots.
          # Standalone `validate` cannot supply a child's aws.edge configuration.
          for root in bootstrap environments/staging environments/production; do
            terraform -chdir="infra/terraform/$root" init -backend=false -lockfile=readonly
            terraform -chdir="infra/terraform/$root" validate
          done
      - name: Test isolation and failure boundaries with mocked AWS
        run: |
          terraform -chdir=infra/terraform/modules/environment init -backend=false -lockfile=readonly
          terraform -chdir=infra/terraform/modules/environment test

  container:
    name: API container and database bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: buddyadmin
          POSTGRES_PASSWORD: buddy-ci-test-only
          POSTGRES_DB: buddy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buddyadmin -d buddy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install shared identity and backend test dependencies
        run: |
          python -m pip install -e ./shared
          python -m pip install -e "./backend[api,dev]" boto3==1.40.50
      - name: Bootstrap, migration and runtime-role permission checks
        env:
          BUDDY_BOOTSTRAP_TEST: 'true'
        run: python -m pytest -p no:pytest-qt infra/tests
      - run: docker build -f infra/container/Dockerfile -t buddy-api:ci .
      - name: Start the real read-only API container
        run: >-
          docker run -d --name buddy-api-ci --read-only --cap-drop=ALL
          --security-opt=no-new-privileges -p 127.0.0.1:8000:8000
          -e BUDDY_ENVIRONMENT=test -e BUDDY_BIND_HOST=0.0.0.0
          -e BUDDY_ALLOWED_HOSTS=localhost,127.0.0.1 buddy-api:ci
      - name: Verify startup and honest unconfigured readiness
        run: python infra/container/smoke_container.py
      - name: Stop test container
        if: always()
        run: docker rm -f buddy-api-ci
