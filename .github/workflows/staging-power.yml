name: Staging on/off
# Staging's API and worker are kept off when nobody is testing, to save AWS credits.
# Run this from the Actions tab to start or stop them. See docs/staging-power.md.
on:
  workflow_dispatch:
    inputs:
      power:
        description: 'Start (on) or stop (off) the staging API and worker'
        type: choice
        options: ['on', 'off', 'status']
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging-power
  cancel-in-progress: false
jobs:
  power:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.BUDDY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.BUDDY_AWS_REGION }}
      - name: Verify AWS account
        shell: bash
        env:
          EXPECTED_AWS_ACCOUNT: ${{ vars.BUDDY_AWS_ACCOUNT_ID }}
        run: |
          actual_account=$(aws sts get-caller-identity --query Account --output text)
          test "$actual_account" = "$EXPECTED_AWS_ACCOUNT"
      - name: Set staging services
        shell: bash
        env:
          POWER: ${{ inputs.power }}
        run: |
          set -euo pipefail
          cluster=buddy-staging
          case "$POWER" in
            on) count=1 ;;
            off) count=0 ;;
            status) count= ;;
            *) echo "Unknown choice: $POWER" >&2; exit 1 ;;
          esac
          if [ -n "$count" ]; then
            for service in api worker; do
              aws ecs update-service --cluster "$cluster" --service "$service" \
                --desired-count "$count" --query 'service.serviceName' --output text
            done
            echo "Waiting for staging to settle..."
            aws ecs wait services-stable --cluster "$cluster" --services api worker
          fi
          aws ecs describe-services --cluster "$cluster" --services api worker \
            --query 'services[].[serviceName,desiredCount,runningCount]' --output text \
            | tee "$RUNNER_TEMP/state.txt"
          {
            echo "### Staging is ${POWER/status/checked}"
            echo '| Service | Desired | Running |'
            echo '|---|---|---|'
            awk '{ print "| " $1 " | " $2 " | " $3 " |" }' "$RUNNER_TEMP/state.txt"
          } >> "$GITHUB_STEP_SUMMARY"
