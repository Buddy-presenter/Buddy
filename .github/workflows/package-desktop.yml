name: Native desktop packages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    name: Native package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./shared
      - run: python -m pip install -e "./frontend[dev]" PyInstaller==6.22.3
      - name: Install checksum-pinned Windows compiler
        if: runner.os == 'Windows'
        run: ./frontend/scripts/release/install_inno.ps1
      - name: Build unsigned preview packages with no release secrets
        run: python frontend/scripts/release/build_desktop.py --output packaged --revision ${{ github.sha }}
      - name: Test the installed or extracted package
        run: python frontend/scripts/release/smoke_package.py packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-preview-${{ runner.os }}-${{ github.sha }}
          path: |
            packaged/*.exe
            packaged/*.zip
            packaged/manifest.json
          if-no-files-found: error
          retention-days: 7
