name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Use offscreen Qt only on macOS
        if: runner.os == 'macOS'
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      # Windows intentionally uses its native platform to catch window/shortcut races.
      - name: Install the shared identity, desktop, and API development projects
        run: |
          python -m pip install -e ./shared
          python -m pip install -e "./frontend[dev]"
          python -m pip install -e "./backend[api,dev]"
      - name: Formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: API schema snapshot and backwards compatibility
        run: python -m buddy_api.schema --check --compare-ref origin/main
      - name: Behavior and Qt lifecycle tests
        env:
          # Keep native Qt diagnostics visible even if the interpreter aborts.
          PYTEST_ADDOPTS: --capture=tee-sys
        run: python scripts/test.py all
      - name: Build distributions
        run: python -m build frontend
      - name: Install built wheel
        shell: bash
        run: |
          python -m pip uninstall -y buddy-desktop
          python -m pip install --no-deps frontend/dist/*.whl
      - name: Start the installed desktop shell
        run: python frontend/scripts/smoke_desktop.py
      - name: Start the installed API and verify real HTTP integration
        run: python backend/scripts/smoke_api.py

  backend:
    name: Backend (Python ${{ matrix.python }})
    # Keep the PostgreSQL/Qt test environment on the stable LTS while
    # ubuntu-latest moves to the newly released 26.04 runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy-ci-test-only
          POSTGRES_DB: buddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUDDY_TEST_DATABASE_URL: postgresql://buddy:buddy-ci-test-only@127.0.0.1:5432/buddy_test?sslmode=disable
      BUDDY_DATABASE_URL: postgresql://buddy:buddy-ci-test-only@127.0.0.1:5432/buddy_test?sslmode=disable
      BUDDY_ENVIRONMENT: test
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install the shared identity, desktop, and API development projects
        run: |
          python -m pip install -e ./shared
          python -m pip install -e "./frontend[dev]"
          python -m pip install -e "./backend[api,dev]"
      - name: API formatting, lint and types
        run: python scripts/quality.py api check
      - name: API schema snapshot and backwards compatibility
        run: python -m buddy_api.schema --check --compare-ref origin/main
      - name: API and real PostgreSQL tests without the desktop Qt plugin
        run: |
          python scripts/test.py api
          python scripts/test.py database
          python scripts/test.py worker
      - name: Install Qt runtime libraries for desktop integration tests
        shell: bash
        run: |
          missing_packages=()
          ldconfig -p | grep -q 'libEGL.so.1' || missing_packages+=(libegl1)
          ldconfig -p | grep -q 'libpulse.so.0' || missing_packages+=(libpulse0)
          if ((${#missing_packages[@]})); then
            # GitHub's Azure/Canonical mirrors can be unavailable independently of the runner.
            # Put a separately hosted Ubuntu mirror first; apt still verifies Ubuntu signatures.
            if ! grep -qFx 'https://mirrors.kernel.org/ubuntu/' /etc/apt/apt-mirrors.txt; then
              sudo sed -i '1i https://mirrors.kernel.org/ubuntu/' /etc/apt/apt-mirrors.txt
            fi
            cat /etc/apt/apt-mirrors.txt
            installed=false
            for attempt in 1 2 3; do
              if sudo timeout --signal=TERM --kill-after=10s 120s apt-get \
                -o Acquire::Retries=1 \
                -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                update && sudo timeout --signal=TERM --kill-after=10s 120s apt-get install --yes --no-install-recommends "${missing_packages[@]}"; then
                installed=true
                break
              fi
              if ((attempt < 3)); then
                sleep $((attempt * 10))
              fi
            done
            if [[ "$installed" != true ]]; then
              echo "Could not install Qt runtime libraries after three bounded attempts." >&2
              exit 1
            fi
          fi
      - name: Cross-component desktop, API and PostgreSQL integration
        run: python scripts/test.py integration
      - run: python -m build backend
      - name: Install wheel and verify packaged migrations against actual PostgreSQL
        shell: bash
        run: |
          python -m pip uninstall -y buddy-backend
          python -m pip install --no-deps backend/dist/*.whl
          cd "$RUNNER_TEMP"
          python -m buddy_api.persistence.migrate upgrade
          python -m buddy_api.persistence.migrate upgrade
          python -m buddy_api.persistence.migrate check
          python -m buddy_api.persistence.migrate current
      - run: python backend/scripts/smoke_api.py --database

  automation:
    name: Automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Project status regression tests (no Project token)
        run: node scripts/test_project_status.cjs
      - name: CI gate regression tests
        run: node scripts/test_ci_gate.cjs

  security:
    name: Security
    uses: ./.github/workflows/security.yml

  ci:
    name: CI
    if: always()
    needs: [frontend, backend, automation, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every job, including security, to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check_ci.cjs
