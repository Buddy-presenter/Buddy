name: Desktop foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Use offscreen Qt only on macOS
        if: runner.os == 'macOS'
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      # Windows intentionally uses its native platform to catch window/shortcut races.
      - name: Install desktop and development dependencies
        run: python -m pip install -e ".[api,dev]"
      - name: Formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: API schema snapshot and backwards compatibility
        run: python -m buddy_api.schema --check --compare-ref origin/main
      - name: Behavior and Qt lifecycle tests
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Install built wheel
        shell: bash
        run: |
          python -m pip uninstall -y buddy-desktop
          python -m pip install --no-deps dist/*.whl
      - name: Start the installed desktop shell
        run: python scripts/smoke_desktop.py
      - name: Start the installed API and verify real HTTP integration
        run: python scripts/smoke_api.py

  persistence:
    name: Persistence (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy-ci-test-only
          POSTGRES_DB: buddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUDDY_TEST_DATABASE_URL: postgresql://buddy:buddy-ci-test-only@127.0.0.1:5432/buddy_test?sslmode=disable
      BUDDY_DATABASE_URL: postgresql://buddy:buddy-ci-test-only@127.0.0.1:5432/buddy_test?sslmode=disable
      BUDDY_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[api,dev]"
      - name: Real PostgreSQL checks without the desktop Qt plugin
        run: python -m pytest -p no:pytest-qt tests/api/test_database.py --strict-markers
      - run: python -m build
      - name: Install wheel and verify packaged migrations against actual PostgreSQL
        shell: bash
        run: |
          python -m pip uninstall -y buddy-desktop
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m buddy_api.persistence.migrate upgrade
          python -m buddy_api.persistence.migrate upgrade
          python -m buddy_api.persistence.migrate check
          python -m buddy_api.persistence.migrate current
      - run: python scripts/smoke_api.py --database

  ci:
    name: CI
    if: always()
    needs: [desktop, persistence]
    runs-on: ubuntu-latest
    steps:
      - name: Require every desktop matrix job to succeed
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          PERSISTENCE_RESULT: ${{ needs.persistence.result }}
        run: test "$DESKTOP_RESULT" = success && test "$PERSISTENCE_RESULT" = success
