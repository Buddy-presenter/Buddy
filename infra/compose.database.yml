# Optional local PostgreSQL; the desktop and API do not require Docker.
services:
  database:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: buddy
      POSTGRES_DB: buddy
      POSTGRES_PASSWORD: ${BUDDY_LOCAL_DATABASE_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:${BUDDY_LOCAL_DATABASE_PORT:-5432}:5432"
    volumes:
      - buddy_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d buddy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  buddy_database:
